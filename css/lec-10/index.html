<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Multi-Effect UI Showcase</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div>
    <header class="header">
        <h1>Multi-Effect UI Showcase</h1>
        <p>All Section Styled Without Flexbox</p>
    </header>
<section class="profile">
    <h2>Layered Profile Cards</h2>

    <div class="card card1">
        <img src="img/manager.jpg" alt="">
        <h3>Alice</h3>
        <p>UI/UX Designer</p>
    </div>

    <div class="card card2">
        <img src="img/founder-removebg-preview.png" alt="">
        <h3>Bob</h3>
        <p>Full Stack Dev</p>
    </div>
</section>  

<section class="profile">
    <h2>Quiz Flashcards</h2>

    <div class="flashcard">
        <div class="flashcard-inner">
            <div class="front">
                <h3>What is HTML?</h3>
            </div>

            <div class="back">
                <h3>Hyper Text Markup Language</h3>
            </div>
        </div>
    </div>

    <div class="flashcard">
        <div class="flashcard-inner">
            <div class="front">
                <h3>What is CSS?</h3>
            </div>

            <div class="back">
                <h3>Cascading Style Sheets</h3>
            </div>
        </div>
    </div>
</section>

<section class="profile">
    <h2>Creative Button</h2>

    <button class="slide-btn">Slide Button</button>
    <button class="glow-btn">Glow Button</button>
</section>
<section class="profile">
    <h2>interactive image Gallery</h2>
    <div class="gallery-box">

        <img src="img/p1.jpg" alt="Image 1">

        <img src="img/p2.jpg" alt="Image 2">

        <img src="img/p3.jpg" alt="Image 3">

</section>
</div>    
</body>
</html>
