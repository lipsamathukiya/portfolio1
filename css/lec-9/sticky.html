<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sticky Notes Dashboard</title>
    <link rel="stylesheet" href="sticky.css">
</head>
<body>

<div class="container">

    <header>
        Sticky Notes Dashboard
    </header>

    <div class="content">

        <div class="sidebar">
            <h1>Categories</h1>
            <ul>
                <li>Personal</li>
                <li>Work</li>
                <li>Ideas</li>
                <li>Reminder</li>
            </ul>
        </div>

        <main>
            <div class="note yellow">
                <h4>📝 Meeting Notes</h4>
                <p>Project deadline is next Monday.</p>
            </div>

            <div class="note green">
                <h4>🛒 Grocery List</h4>
                <p>Milk, Eggs, Bread, Coffee, Fruits</p>
            </div>

            <div class="note orange">
                <h4>💡 App Idea</h4>
                <p>Reminder app with voice and image.</p>
            </div>

            <div class="note blue">
                <h4>🎯 Today's Goals</h4>
                <p>
                    1. Finish UI <br>
                    2. Record Demo <br>
                    3. Submit Lab
                </p>
            </div>
        </main>

    </div>

    <footer>
        <button>Add</button>
        <button>Delete</button>
    </footer>

</div>
</body>
</html>
