<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h3>Welcome to the Parallax World</h3>
    </div>

    <div class="image"></div>

    <div class="linear">
        <h3 class="h3">Linear Gradient Section</h3>
    </div>

    <div class="radial">
        <h3 class="h3">Radial Gradient Section</h3>
    </div>

    <div class="conic">
        <h3 class="h3">Conic Gradient Section</h3>
    </div>

    <div class="text-box">
        <h1>This block uses two classes: <b>text-block</b> and <b>highlight</b></h1>
    </div>

    <div class="parent">
        <h2>Parent Box Heading</h2>
        <p>This paragraph is a child element styled inside the parent.</p>
    </div>
</div>

</body>
</html>
