<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Converter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f8;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #001f3f, #003b73);
            color: white;
            padding: 25px 0;
            box-shadow: 0 4px 12px rgba(0, 31, 63, 0.3);
        }

        .header-title {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin: 0;
        }

        .header-subtitle {
            text-align: center;
            color: #dbe9f7;
            margin-top: 8px;
            font-size: 16px;
        }

        /* Cards */
        .program-card {
            height: 250px;
            background: white;
            border: 1px solid #003b73;
            border-radius: 20px;
            text-align: center;
            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;

            box-shadow: 0 6px 15px rgba(0, 31, 63, 0.15);
        }

        .program-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 31, 63, 0.3);
        }

        .program-card h3 {
            color: #003b73;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .program-card p {
            color: #333;
            margin-bottom: 25px;
        }

        /* Button */
        .btn-custom {
            background: #003b73;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;

            box-shadow: 0 4px 10px rgba(0, 31, 63, 0.3);
        }

        .btn-custom:hover {
            background: #001f3f;
            color: white;
            transform: translateY(-2px);
        }

        /* Video Box */
        .video-box {
            background: white;
            border: 2px solid #003b73;
            border-radius: 20px;
            padding: 25px;
            margin-top: 50px;
            box-shadow: 0 6px 15px rgba(0, 31, 63, 0.15);
        }

        .video-title {
            text-align: center;
            color: #003b73;
            margin-bottom: 20px;
            font-weight: bold;
        }

        video {
            width: 100%;
            border-radius: 12px;
            border: 2px solid #003b73;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container">
            <h1 class="header-title">Time Converter</h1>

            <p class="header-subtitle">
                Click The Button To View Programs
            </p>
        </div>
    </header>

    <div class="container mt-5">

        <div class="row g-4 justify-content-center">

            <!-- Program 1 -->
            <div class="col-md-6">

                <div class="program-card">

                    <h3>Program 1</h3>

                    <p>Time Converter</p>

                    <a href="TIME.CPP" class="btn-custom">
                        View Program
                    </a>

                </div>

            </div>

        </div>

        <div class="video-box">

            <h2 class="video-title">
                Time Converter Program Demonstration Video
            </h2>

            <video controls>
                <source src="screen-capture (2).webm" type="video/webm">
            </video>

        </div>

    </div>

</body>

</html>
