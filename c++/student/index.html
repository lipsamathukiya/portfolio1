<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management System </title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }

        header {
            background-color: #0b1220;
            padding: 30px 0;
        }

        .header-title {
            text-align: center;
            color: white;
            font-size: 38px;
            font-weight: bold;
            margin: 0;
        }

        .header-subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-top: 8px;
            font-size: 16px;
        }

        .program-card {
            min-height: 250px;
            background-color: #111c32;
            border: 1px solid #0879ff;
            border-radius: 18px;
            text-align: center;
            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }

        .program-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 121, 255, 0.25);
        }

        .icon-box {
            width: 55px;
            height: 55px;
            border: 1px solid #0879ff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            color: #00d9ff;
            font-size: 27px;
            background-color: #0b1930;
        }

        .program-card h3 {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .program-card p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-custom {
            background-color: #0879ff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 9px 22px;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">

            <h1 class="header-title">
                Student Result Management System </h1>

            <p class="header-subtitle">
                Click The Button To View Programs
            </p>

        </div>
    </header>

    <div class="container mt-5">

        <div class="row g-4 justify-content-center">

            <div class="col-md-6">

                <div class="program-card">

                    <div class="icon-box">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <h3>
                        Program 1
                    </h3>

                    <p>
                        Student Result Management System
                    </p>

                    <div class="d-flex justify-content-center gap-2">
                        <a href="./std.cpp" class="btn-custom">
                            View Program
                        </a>
                        <a href="img/std.png" class="btn-custom">
                            View Output
                        </a>
                    </div>

                </div>

            </div>

        </div>



</body>

</html>
